name: Build Kotlin APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/mobile-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x apps/mobile-app/gradlew

    - name: Build APK with Gradle
      working-directory: apps/mobile-app
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HanTech-Kotlin-APK
        path: apps/mobile-app/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

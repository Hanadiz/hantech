name: Build Han-Tech APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/mobile-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.2'

    - name: Install Flet
      run: |
        python -m pip install --upgrade pip
        pip install flet

    - name: Build Android APK
      working-directory: apps/mobile-app
      run: |
        echo "[project]" > pyproject.toml
        echo "name = 'hantech'" >> pyproject.toml
        echo "version = '1.0.0'" >> pyproject.toml
        echo "requires-python = '>=3.8'" >> pyproject.toml
        echo "dependencies = ['flet']" >> pyproject.toml
        
        # Using --product instead of --app-name
        flet build apk --project "hantech" --org "com.hantech" --product "HanTech"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HanTech-APK
        path: apps/mobile-app/build/apk/*.apk

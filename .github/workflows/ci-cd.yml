name: Build Han-Tech APK
on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/mobile-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build APK
      id: build
      uses: flet-dev/flet-build-action@v1
      with:
        target: apk
        working-directory: apps/mobile-app
        runner-python-version: "3.11"
        bundled-python-version: "3.11"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HanTech-APK
        path: ${{ steps.build.outputs.archive-path }}
        if-no-files-found: error
